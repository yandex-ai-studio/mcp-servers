tool:
  name: search_kaggle_datasets
  description: Search public Kaggle datasets and return detailed dataset information with a bounded file list.
  function_call:
    function_id: REPLACE_WITH_FUNCTION_ID
    tag: $latest
  input_json_schema:
    type: object
    properties:
      query:
        type: string
        description: Search terms for public Kaggle datasets.
      max_results:
        type: integer
        description: Maximum number of datasets to return.
        minimum: 1
        maximum: 5
        default: 3
      max_files:
        type: integer
        description: Maximum number of files to return for each dataset.
        minimum: 1
        maximum: 100
        default: 20
      sort_by:
        type: string
        description: Dataset result ordering.
        enum: [hottest, votes, updated, active, published]
        default: hottest
      file_type:
        type: string
        description: Restrict results by dataset file type.
        enum: [all, csv, sqlite, json, bigQuery, parquet]
      license:
        type: string
        description: Restrict results by license group.
        enum: [all, cc, gpl, odb, other]
      min_size:
        type: integer
        description: Minimum dataset size in bytes.
        minimum: 0
      max_size:
        type: integer
        description: Maximum dataset size in bytes.
        minimum: 0
    required: [query]
